name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

env:
  # Explicit palettes keep both themes the same size and match GitHub's UI colors.
  DARK_PALETTE: bg_color=0d1117&title_color=58a6ff&icon_color=1f6feb&text_color=c9d1d9&border_color=30363d
  LIGHT_PALETTE: bg_color=ffffff&title_color=0969da&icon_color=1f6feb&text_color=24292f&border_color=d0d7de
  STATS_BASE: username=${{ github.repository_owner }}&show_icons=true&border_radius=10&card_width=430
  LANGS_BASE: username=${{ github.repository_owner }}&layout=compact&langs_count=8&border_radius=10&card_width=430

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validating the token up front keeps a dead/rate-limited token from
      # rendering "Something went wrong" cards into the README.
      - name: Validate token
        id: token
        env:
          PAT: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::GH_PERSONAL_TOKEN secret is missing. Add a PAT with the 'repo' and 'read:user' scopes."
            exit 1
          fi

          limits=$(curl -sS -o /tmp/limits.json -w "%{http_code}" \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit || true)

          if [ "$limits" != "200" ]; then
            echo "::error::GH_PERSONAL_TOKEN is invalid or expired (HTTP $limits). Create a new PAT with the 'repo' and 'read:user' scopes and update the secret."
            exit 1
          fi

          if grep -qE '"(core|graphql)":\{[^}]*"remaining":0' /tmp/limits.json; then
            echo "::error::GH_PERSONAL_TOKEN is currently rate limited. Cards will be regenerated on the next scheduled run."
            exit 1
          fi

          echo "value=$PAT" >> "$GITHUB_OUTPUT"

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.STATS_BASE }}&${{ env.DARK_PALETTE }}
          path: images/stats-dark.svg
          token: ${{ steps.token.outputs.value }}

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.STATS_BASE }}&${{ env.LIGHT_PALETTE }}
          path: images/stats-light.svg
          token: ${{ steps.token.outputs.value }}

      - name: Generate top langs card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.LANGS_BASE }}&${{ env.DARK_PALETTE }}
          path: images/langs-dark.svg
          token: ${{ steps.token.outputs.value }}

      - name: Generate top langs card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.LANGS_BASE }}&${{ env.LIGHT_PALETTE }}
          path: images/langs-light.svg
          token: ${{ steps.token.outputs.value }}

      # The action writes an error placeholder instead of failing on API errors,
      # so restore the committed card whenever that happens.
      - name: Verify cards are valid
        run: |
          status=0
          for file in images/stats-dark.svg images/stats-light.svg images/langs-dark.svg images/langs-light.svg; do
            if ! grep -q "<svg" "$file"; then
              echo "::error file=$file::$file is missing or not a valid SVG"
              git checkout -- "$file" 2>/dev/null || true
              status=1
            elif grep -q "Something went wrong" "$file"; then
              echo "::error file=$file::Card generation failed; keeping the last good version"
              git checkout -- "$file"
              status=1
            fi
          done
          exit $status

      - name: Commit cards
        run: |
          if git diff --quiet -- images/; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/
          git commit -m "workflow: Update README cards"
          git push
