name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

env:
  STATS_OPTIONS: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark
  LANGS_OPTIONS: username=${{ github.repository_owner }}&layout=compact&theme=github_dark

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reject the PAT when it is missing, expired or out of quota, so a dead
      # token can never silently produce "Something went wrong" cards.
      - name: Resolve token
        id: token
        env:
          PAT: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          token="${{ github.token }}"
          if [ -n "$PAT" ]; then
            limits=$(curl -fsS -H "Authorization: Bearer $PAT" \
              https://api.github.com/rate_limit 2>/dev/null || true)
            if [ -z "$limits" ]; then
              echo "::warning::GH_PERSONAL_TOKEN is invalid or expired — using GITHUB_TOKEN"
            elif echo "$limits" | grep -qE '"remaining":0'; then
              echo "::warning::GH_PERSONAL_TOKEN is rate limited — using GITHUB_TOKEN"
            else
              token="$PAT"
            fi
          else
            echo "::warning::GH_PERSONAL_TOKEN is not set — using GITHUB_TOKEN"
          fi
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}
          path: images/stats.svg
          token: ${{ steps.token.outputs.value }}

      - name: Generate top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}
          path: images/langs.svg
          token: ${{ steps.token.outputs.value }}

      - name: Detect error cards
        id: detect
        run: |
          broken=0
          for file in images/stats.svg images/langs.svg; do
            if grep -q "Something went wrong" "$file"; then
              broken=1
              echo "::warning file=$file::Card rendered with an error placeholder"
            fi
          done
          echo "broken=$broken" >> "$GITHUB_OUTPUT"

      # Second chance with the workflow token (works for public data even when
      # the personal token is exhausted).
      - name: Retry stats card with GITHUB_TOKEN
        if: steps.detect.outputs.broken == '1'
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}
          path: images/stats.svg
          token: ${{ github.token }}

      - name: Retry top langs card with GITHUB_TOKEN
        if: steps.detect.outputs.broken == '1'
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}
          path: images/langs.svg
          token: ${{ github.token }}

      # Never let a broken card reach the README: restore the committed version.
      - name: Verify cards are valid
        run: |
          status=0
          for file in images/stats.svg images/langs.svg; do
            if ! grep -q "<svg" "$file"; then
              echo "::error file=$file::$file is missing or not an SVG"
              git checkout -- "$file" 2>/dev/null || true
              status=1
            elif grep -q "Something went wrong" "$file"; then
              echo "::error file=$file::$file still contains the error placeholder; keeping the committed version"
              git checkout -- "$file"
              status=1
            fi
          done
          exit $status

      - name: Commit cards
        run: |
          if git diff --quiet -- images/stats.svg images/langs.svg; then
            echo "Cards unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/stats.svg images/langs.svg
          git commit -m "workflow: Update README cards"
          git push
